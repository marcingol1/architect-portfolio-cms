# Netlify: Astro build and redirects from the old URLs (Gatsby/DatoCMS version).
[build]
  command = "pnpm build"
  publish = "dist"

[[redirects]]
  from = "/works"
  to = "/realizacje/"
  status = 301

[[redirects]]
  from = "/works/*"
  to = "/realizacje/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/kontakt/"
  status = 301
