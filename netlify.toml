# Netlify: build Astro i przekierowania ze starych adresów (wersja Gatsby/DatoCMS).
[build]
  command = "pnpm build"
  publish = "dist"

[[redirects]]
  from = "/works"
  to = "/realizacje/"
  status = 301

[[redirects]]
  from = "/works/*"
  to = "/realizacje/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/kontakt/"
  status = 301
